project_id = "finace_management"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Local: bật để thử luồng đăng ký. PRODUCTION đặt ở dashboard Supabase và giữ TẮT
# tới khi xong phase 3 (beta mời) — xem plans/261027-1012-saas-signup-api-key-credits/.
# Production khi mở: bật xác nhận email, SMTP riêng, captcha Turnstile ([auth.captcha]).
enable_signup = true
# Khớp kiểm tra ở SignupPage (MIN_PASSWORD). Mặc định GoTrue là 6.
minimum_password_length = 8
# ⚠️ KHÔNG chạy `supabase config push`: lệnh đó đẩy toàn bộ [auth] (kể cả enable_signup = true
# ở trên) lên project production. Cấu hình auth production chỉ chỉnh trên dashboard.

[auth.mfa.totp]
# Bắt buộc cho admin (function `admin` từ chối JWT chưa aal2). Production: bật ở dashboard
# (Authentication → Multi-Factor) — config.toml chỉ áp cho local.
enroll_enabled = true
verify_enabled = true

[auth.email]
# Bật email provider (đây là cách ĐĂNG NHẬP; chặn đăng ký dùng
# `enable_signup` ở [auth] bên trên, không phải ở đây).
enabled = true
# Không có mail server ở local/single-user -> bỏ xác nhận email
enable_confirmations = false

[studio]
enabled = true
port = 54323

# vector (log collector) hay unhealthy trên WSL2 và không cần cho dev/test schema.
[analytics]
enabled = false

[storage]
# App không dùng file upload
enabled = false


[functions.parse-transaction]
enabled = true
verify_jwt = false
import_map = "./functions/parse-transaction/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/parse-transaction/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/parse-transaction/*.html" ]

[functions.delete-account]
enabled = true
# Gateway kiểm JWT trước; function lấy user từ chính token đó rồi mới xoá.
verify_jwt = true

[functions.admin]
enabled = true
# Gateway kiểm JWT; function kiểm thêm app_metadata.role = 'admin' + aal2.
verify_jwt = true

# --- Thanh toán MoMo / ZaloPay (phase 3) ---
[functions.create-payment]
enabled = true
# Gateway kiểm JWT; function còn getUser(token) để lấy user id.
verify_jwt = true

[functions.payment-ipn-momo]
enabled = true
# MoMo gọi server-to-server, không có JWT Supabase: xác thực bằng chữ ký HMAC trong body.
verify_jwt = false

[functions.payment-ipn-zalopay]
enabled = true
# ZaloPay callback không có JWT Supabase: xác thực bằng MAC (key2) trên chuỗi data.
verify_jwt = false

[functions.payment-reconcile]
enabled = true
# Scheduler ngoài gọi, xác thực bằng header x-reconcile-secret.
verify_jwt = false
