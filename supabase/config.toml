project_id = "finace_management"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Local: bật để thử luồng đăng ký. PRODUCTION đặt ở dashboard Supabase và giữ TẮT
# tới khi xong phase 3 (beta mời) — xem plans/261027-1012-saas-signup-api-key-credits/.
# Production khi mở: bật xác nhận email, SMTP riêng, captcha Turnstile ([auth.captcha]).
enable_signup = true

[auth.email]
# Bật email provider (đây là cách ĐĂNG NHẬP; chặn đăng ký dùng
# `enable_signup` ở [auth] bên trên, không phải ở đây).
enabled = true
# Không có mail server ở local/single-user -> bỏ xác nhận email
enable_confirmations = false

[studio]
enabled = true
port = 54323

# vector (log collector) hay unhealthy trên WSL2 và không cần cho dev/test schema.
[analytics]
enabled = false

[storage]
# App không dùng file upload
enabled = false


[functions.parse-transaction]
enabled = true
verify_jwt = false
import_map = "./functions/parse-transaction/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/parse-transaction/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/parse-transaction/*.html" ]

[functions.delete-account]
enabled = true
# Gateway kiểm JWT trước; function lấy user từ chính token đó rồi mới xoá.
verify_jwt = true
