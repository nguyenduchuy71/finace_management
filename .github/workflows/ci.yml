name: CI

# Kiểm tra rồi MỚI deploy Vercel.
#
# Git Integration của Vercel đã TẮT (`git.deploymentEnabled` trong vercel.json): trước đây
# Vercel tự deploy ngay khi push, song song với CI — code vỡ test vẫn lên production.
# Giờ deploy là job `deploy` chạy SAU `verify` (needs) bằng Vercel CLI:
#   - push vào main  -> deploy PRODUCTION
#   - pull request   -> deploy PREVIEW (bỏ qua PR từ fork: không đọc được secrets)
#
# Secrets cần có (Settings > Secrets and variables > Actions > Secrets):
#   VERCEL_TOKEN       — vercel.com/account/tokens
#   VERCEL_ORG_ID      — `.vercel/project.json` sau khi chạy `vercel link`, khoá "orgId"
#   VERCEL_PROJECT_ID  — cùng file, khoá "projectId"
# Biến VITE_* của bản deploy lấy từ Environment Variables của project trên Vercel, KHÔNG lấy từ GitHub.
# Bản deploy được BUILD TRÊN VERCEL (`vercel deploy` không --prebuilt): biến loại "Sensitive" chỉ đọc được
# trong môi trường build của Vercel — `vercel pull` ghi "[SENSITIVE]" thay giá trị thật, build trên runner
# sẽ đóng gói chuỗi đó làm URL Supabase (production từng trắng trang: "Invalid supabaseUrl").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Push liên tiếp vào cùng 1 PR/nhánh -> huỷ lần kiểm tra cũ (không áp cho job deploy).
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` cần package-lock.json — giống hệt installCommand của Vercel
      - name: Install dependencies
        run: npm ci

      # Gate thật: CLAUDE.md yêu cầu lint sạch (0 lỗi/cảnh báo).
      - name: Lint
        run: npm run lint

      # Unit test không cần Docker. Integration test KHÔNG chạy ở CI: cần cả stack Supabase
      # local và seed (supabase/seeds/* bị .gitignore vì chứa dữ liệu thẻ thật).
      - name: Unit tests
        run: npm test -- --run

      # Gate thật: chạy ĐÚNG lệnh build của Vercel (tsc -b && vite build).
      # tsconfig.app.json include cả `src` nên bước này type-check luôn file test.
      - name: Build
        run: npm run build
        env:
          # Build chỉ để kiểm tra; bản deploy thật build lại trong job `deploy` với biến của Vercel.
          # `||` fallback: fork PR không đọc được secrets của repo gốc.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'build-time-placeholder' }}

      # Edge function parse-transaction: test parser (Deno), cùng phiên bản Deno với lệnh test local.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Edge function — type check & parser tests
        working-directory: supabase/functions/parse-transaction
        run: |
          deno check index.ts ingest.ts credit-ingest.ts backfill-unparsed.ts try-parse.ts api-key-auth.ts
          deno check ../delete-account/index.ts ../admin/index.ts
          deno test --allow-all . ../admin

  deploy:
    name: Deploy Vercel (${{ github.event_name == 'push' && 'production' || 'preview' }})
    needs: verify
    # Fork PR không có secrets -> bỏ qua thay vì fail.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Không huỷ giữa chừng một lần deploy; các lần deploy cùng môi trường chạy lần lượt.
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'production' || github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret $v (xem đầu file ci.yml)"; exit 1; fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@62.5.0

      - name: Deploy
        id: deploy
        run: |
          args=(); [ "$VERCEL_ENV" = production ] && args+=(--prod)
          # Vercel build từ source với Environment Variables của nó (đọc được biến Sensitive).
          # vite.config.ts làm build FAIL nếu VITE_SUPABASE_URL không phải URL hợp lệ -> không deploy bản trắng trang.
          url=$(vercel deploy "${args[@]}" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
